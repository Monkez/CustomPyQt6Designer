[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monkez-pyqt6"
version = "0.5.0"
description = "Monkez widgets, UI loader and Qt Designer integration for PyQt6 projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.4.2,<6.12",
]
authors = [
    { name = "Monkez" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Framework :: PyQt",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
camera = [
    "opencv-python>=4.8",
]
designer = [
    "pyqt6-tools==6.4.2.3.3; python_version == '3.11'",
    "PyQt6-Fluent-Widgets[full]",
    "setuptools<81; python_version == '3.11'",
]
all = [
    "opencv-python>=4.8",
    "pyqt6-tools==6.4.2.3.3; python_version == '3.11'",
    "PyQt6-Fluent-Widgets[full]",
    "setuptools<81; python_version == '3.11'",
]
dev = [
    "build==1.3.0",
    "ruff==0.16.1",
]

[project.urls]
Homepage = "https://github.com/Monkez/CustomPyQt6Designer"
Repository = "https://github.com/Monkez/CustomPyQt6Designer.git"
Issues = "https://github.com/Monkez/CustomPyQt6Designer/issues"

[project.scripts]
monkez-pyqt6 = "monkez_pyqt6.launcher:main"
monkez-plugin-info = "monkez_pyqt6.plugin_info:main"
monkez-gallery = "monkez_pyqt6.gallery_app:main"
custom-pyqt6-designer = "monkez_pyqt6.launcher:main"
custom-pyqt6-plugin-info = "monkez_pyqt6.plugin_info:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"monkez_pyqt6" = [
    "designer_plugins/*.py",
    "templates/*.ui",
]
"monkez_pyqt6.monkez_widgets" = [
    "monkez_assets/icons/*",
    "monkez_assets/images/*",
]
"monkez_pyqt6.monkez_canva" = [
    "schemas/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
